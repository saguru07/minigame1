<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Rings</title>
<style>
  :root{--bg:#14171b;--board:#0b2230;--ink:#e8eef3;--muted:#8a9aa8;--ok:#4fd18b;--bad:#ff6b5e;--timer:#ff4d00}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;min-height:100vh}
  h1{font-size:1.2rem;margin:0}
  .help{margin:0;color:var(--muted);font-size:.88rem;text-align:center;max-width:460px;line-height:1.5}
  .stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;font-size:.95rem}
  .stats span{color:var(--muted)}
  .stage{position:relative;width:min(94vw,520px);aspect-ratio:1;background:var(--board)}
  canvas{width:100%;height:100%;display:block}
  .bar{width:min(94vw,520px);height:8px;background:#242b33;margin-top:-12px}
  .bar i{display:block;height:100%;width:100%;background:var(--timer);transform-origin:left}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;text-align:center;padding:28px;background:rgba(11,34,48,.94)}
  .overlay.show{display:flex}
  .overlay h2{margin:0;font-size:1.35rem}
  .overlay h2:empty{display:none}
  .overlay p{margin:4px 0;color:#b9c7d2;font-size:.95rem;line-height:1.5}
  .overlay.win h2{color:var(--ok)} .overlay.lose h2{color:var(--bad)}
  button{font:inherit;font-weight:700;color:#0b1015;background:var(--ink);border:0;border-radius:6px;padding:10px 20px;cursor:pointer;margin-top:8px}
  button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
  .touch{display:none;gap:10px}
  .touch button{background:#1d2933;color:var(--ink);border:1px solid #33444f;margin:0;min-width:84px;user-select:none;touch-action:none}
  @media (pointer:coarse){.touch{display:flex}}
</style>
</head>
<body>

<p class="help" id="help"></p>
<div class="stats">
  <div><span>Time</span> <b id="sTime">0.00</b></div>
</div>

<div class="stage">
  <canvas id="cv" width="1040" height="1040"></canvas>
  <div class="overlay" id="overlay" role="alertdialog" aria-live="assertive">
    <h2 id="oTitle"></h2>
    <div id="oBody"></div>
    <button id="oBtn"></button>
  </div>
</div>
<div class="bar" aria-hidden="true"><i id="barFill"></i></div>

<div class="touch">
  <button id="tL">&larr;</button>
  <button id="tOk">Confirm</button>
  <button id="tR">&rarr;</button>
</div>

<script>
/* =====================================================================
   PENGATURAN — ubah bagian ini saja untuk menyesuaikan game & teks
   ===================================================================== */
const CONFIG = {
  help:  "Rotate the active ring with ← → (or A / D) until every dot sits under a block of the same color. Press ENTER to confirm and move on to the next ring. Press R to restart.",
  startButton: "Start",

  // Aturan game
  dotsPerRing: [3, 4, 5, 6, 6],   // dari cincin terkecil ke terbesar (panjang array = jumlah cincin)
  totalSeconds: 30,               // batas waktu seluruh permainan
  failOnWrong: true,              // true: ENTER salah = gagal. false: hanya getar, boleh coba lagi
  colors: ["#ffc107", "#2196f3", "#d81b60"],

  // Papan & pengacakan (semuanya diacak ulang setiap game dimulai)
  spokes: 12,             // jumlah garis keluar (spoke). Titik & blok warna selalu menempel di garis ini
  stepDelayFirst: 220,    // jeda (ms) sebelum putaran berulang saat tombol ditahan
  stepDelayRepeat: 80,    // kecepatan putaran berulang (ms per langkah)
  maxCoverage: 0.55,      // maks bagian cincin yang boleh tertutup blok warna (0.55 = sisanya selalu kosong)
  extendChance: 0.2,      // peluang blok warna memanjang ke garis kosong di sebelahnya
  startPickTop: 0.25,     // 0.1 = posisi awal selalu yang terjauh dari tujuan, 1 = acak penuh

  // Teks saat BERHASIL — susun sendiri.
  // Tiap item array = satu paragraf. Boleh HTML sederhana (<b>, <a>, <br>). {time} = waktu total.
  successTitle: "Access Granted!",
  successLines: [
    "Congratulations, every ring is aligned.",
    "Your secret code: <b>ABC-1234</b>",
    "Finished in {time} seconds."
  ],
  successButton: "Play again",
  successRedirect: "",    // isi URL untuk pindah halaman otomatis setelah menang
  successDelayMs: 2500,

  // Teks saat GAGAL
  failTitle: "Failed",
  failTimeout: "Time is up.",
  failWrong: "Some dots are not under a block of the same color.",
  failButton: "Try again",

  // Dipanggil saat berhasil (mis. kirim ke server-mu)
  onSuccess(totalSeconds){ }
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const W = cv.width, C = W/2, TAU = Math.PI*2;
const S = CONFIG.spokes, STEP = TAU/S;
const RINGS = CONFIG.dotsPerRing.length;
const R_OUT = C-70, R_STEP = R_OUT/RINGS;
const DOT_R = 15;
const BLOCK_OFF = 30;  // jarak blok warna dari jalur titik (px)
const BLOCK_W = 10;    // tebal blok warna
const BLOCK_GAP = 6;   // celah antar blok yang bersebelahan (px)

$("help").textContent = CONFIG.help;

let state = "idle", rings = [], cur = 0, startT = 0, flash = null, shake = 0;
let dir = 0, lastDir = 0, nextStep = 0;
let keys = {left:false,right:false};

const mod = a => ((a % S) + S) % S;
const rndInt = n => Math.floor(Math.random()*n);
const pick = a => a[rndInt(a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rndInt(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; }

/* Blok warna = deretan slot spoke berurutan dengan warna sama (otomatis digabung jadi satu) */
function runsOf(own){
  if (own.every(c => c && c === own[0])) return [{color:own[0], s:0, len:S, full:true}];
  const start = own.findIndex((c,i) => c !== own[mod(i-1)]);
  if (start < 0) return [];
  const res = [];
  let i = 0;
  while (i < S){
    const idx = mod(start+i), c = own[idx];
    let len = 1;
    while (i+len < S && own[mod(start+i+len)] === c) len++;
    if (c) res.push({color:c, s:idx, len});
    i += len;
  }
  return res;
}

function ringSolved(r){
  return r.dots.every(d => r.own[mod(d.slot + r.pos)] === d.color);
}

function slotDist(own, x, color){
  let m = S;
  for (let y=0;y<S;y++) if (own[y]===color){ const d=Math.abs(x-y); m=Math.min(m,d,S-d); }
  return m;
}

function buildRing(k){
  const cap = Math.max(2, Math.floor(S*CONFIG.maxCoverage));   // maks slot yang boleh berwarna
  const n = Math.min(CONFIG.dotsPerRing[k], cap);
  const r = {rad:R_STEP*(k+1), pos:0, vis:0, dots:[], own:Array(S).fill(null), done:false};
  const solvedPos = rndInt(S);

  // warna titik acak (minimal 2 warna berbeda), di slot spoke acak
  let cols;
  do { cols = Array.from({length:n}, () => pick(CONFIG.colors)); }
  while (new Set(cols).size < Math.min(2, CONFIG.colors.length));
  const slots = shuffle([...Array(S).keys()]).slice(0,n);
  slots.forEach((s,i) => r.dots.push({slot:s, color:cols[i]}));

  // klaim slot tujuan tiap titik
  const own = r.own;
  r.dots.forEach(d => own[mod(d.slot+solvedPos)] = d.color);

  // pastikan tiap blok minimal 2 slot (panjang > 0), blok sendirian diperpanjang atau digabung
  for (let guard=0; guard<200; guard++){
    const single = runsOf(own).find(u => u.len===1 && !u.full);
    if (!single) break;
    const a = single.s, L = mod(a-1), R = mod(a+1);
    if (own[L]===null && own[R]===null) own[Math.random()<.5?L:R] = single.color;
    else if (own[L]===null) own[L] = single.color;
    else if (own[R]===null) own[R] = single.color;
    else {
      const nc = own[L];
      r.dots.forEach(d => { if (mod(d.slot+solvedPos)===a) d.color = nc; });
      own[a] = nc;
    }
  }

  // blok memanjang acak (sewarna jadi satu blok panjang)
  for (let t=0; t<S; t++){
    const a = rndInt(S);
    if (!own[a]) continue;
    const dd = Math.random()<.5 ? 1 : -1, b = mod(a+dd);
    if (own.filter(Boolean).length >= cap) break;
    if (own[b]===null && Math.random()<CONFIG.extendChance) own[b] = own[a];
  }

  // posisi awal: pilih dari posisi yang titiknya paling jauh dari blok warna tujuannya
  const cand = [];
  for (let p=0;p<S;p++){
    r.pos = p;
    if (ringSolved(r)) continue;
    const ds = r.dots.map(d => slotDist(own, mod(d.slot+p), d.color));
    cand.push({p, score: Math.min(...ds) + 0.5*(ds.reduce((s,x)=>s+x,0)/ds.length)});
  }
  if (!cand.length) return buildRing(k); // jarang: semua posisi benar, buat ulang cincin
  cand.sort((x,y) => y.score-x.score);
  const top = Math.max(1, Math.ceil(cand.length*CONFIG.startPickTop));
  r.pos = cand[rndInt(top)].p;
  r.vis = r.pos*STEP;
  return r;
}

function start(){
  $("overlay").classList.remove("show");
  rings = CONFIG.dotsPerRing.map((_,k) => buildRing(k));
  cur = 0; state = "playing"; startT = performance.now(); lastDir = 0;
}

function confirmRing(){
  if (state!=="playing") return;
  if (ringSolved(rings[cur])){
    flash = {t:performance.now(), k:cur};
    rings[cur].done = true;
    cur++;
    if (cur>=RINGS) return end(true);
  } else if (CONFIG.failOnWrong){
    end(false, CONFIG.failWrong);
  } else shake = performance.now();
}

function end(win, reason){
  state = "over";
  const total = (performance.now()-startT)/1000;
  $("overlay").className = "overlay show "+(win?"win":"lose");
  if (win){
    $("oTitle").textContent = CONFIG.successTitle;
    $("oBody").innerHTML = CONFIG.successLines.map(l=>`<p>${l.replace("{time}",total.toFixed(2))}</p>`).join("");
    $("oBtn").textContent = CONFIG.successButton;
    try{CONFIG.onSuccess(total);}catch(e){console.error(e);}
    if (CONFIG.successRedirect) setTimeout(()=>{location.href=CONFIG.successRedirect;},CONFIG.successDelayMs);
  } else {
    $("oTitle").textContent = CONFIG.failTitle;
    $("oBody").innerHTML = `<p>${reason}</p>`;
    $("oBtn").textContent = CONFIG.failButton;
  }
  $("oBtn").focus();
}
$("oBtn").addEventListener("click", start);

addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if (k==="arrowleft"||k==="a") keys.left=true;
  else if (k==="arrowright"||k==="d") keys.right=true;
  else if (k==="enter" && state==="playing"){ e.preventDefault(); confirmRing(); }
  else if (k==="r") start();
});
addEventListener("keyup", e=>{
  const k = e.key.toLowerCase();
  if (k==="arrowleft"||k==="a") keys.left=false;
  if (k==="arrowright"||k==="d") keys.right=false;
});
function hold(id,side){
  const b=$(id);
  b.addEventListener("pointerdown",e=>{e.preventDefault();keys[side]=true;});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[side]=false));
}
hold("tL","left"); hold("tR","right");
$("tOk").addEventListener("click", confirmRing);

/* ---------- gambar ---------- */
function draw(now){
  ctx.clearRect(0,0,W,W);
  ctx.save();
  if (shake && now-shake<250) ctx.translate(Math.sin(now/15)*8,0); else shake=0;

  // garis keluar (spoke)
  ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=2;
  for(let i=0;i<S;i++){
    const a=i*STEP;
    ctx.beginPath(); ctx.moveTo(C,C); ctx.lineTo(C+Math.cos(a)*(R_OUT+30),C+Math.sin(a)*(R_OUT+30)); ctx.stroke();
  }

  rings.forEach((r,k)=>{
    const active = state==="playing" && k===cur;
    // blok warna: berada di luar titik (tidak menyentuh), dan setiap slot spoke
    // dicakup tepat di tengahnya, jadi blok & titik yang cocok selalu sejajar di spoke yang sama
    const br = r.rad + BLOCK_OFF, gap = BLOCK_GAP/br;
    ctx.lineWidth = BLOCK_W; ctx.lineCap = "butt";
    runsOf(r.own).forEach(u=>{
      ctx.strokeStyle = u.color;
      ctx.beginPath();
      if (u.full) ctx.arc(C,C,br,0,TAU);
      else ctx.arc(C,C,br,(u.s-0.5)*STEP+gap,(u.s+u.len-0.5)*STEP-gap);
      ctx.stroke();
    });

    // garis cincin
    ctx.lineWidth = active?4:2.5;
    ctx.strokeStyle = r.done ? "#4fd18b" : (active ? "#ffffff" : "rgba(255,255,255,.55)");
    ctx.beginPath(); ctx.arc(C,C,r.rad,0,TAU); ctx.stroke();

    // titik (ada garis tepi gelap supaya tetap terlihat di atas blok sewarna)
    r.dots.forEach(d=>{
      const a = d.slot*STEP + r.vis;
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(C+Math.cos(a)*r.rad,C+Math.sin(a)*r.rad,active?DOT_R+2:DOT_R,0,TAU); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = active ? "#fff" : "#0b2230"; ctx.stroke();
    });
  });

  if (flash){
    const p=(now-flash.t)/400;
    if(p>=1) flash=null; else {
      ctx.strokeStyle=`rgba(79,209,139,${1-p})`; ctx.lineWidth=10;
      ctx.beginPath(); ctx.arc(C,C,rings[flash.k].rad+p*30,0,TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if (state==="playing"){
    dir = (keys.right?1:0)-(keys.left?1:0);
    const r = rings[cur];
    if (dir!==lastDir){
      lastDir = dir;
      if (dir){ r.pos += dir; nextStep = now + CONFIG.stepDelayFirst; }
    } else if (dir && now>=nextStep){
      r.pos += dir; nextStep = now + CONFIG.stepDelayRepeat;
    }
    const el=(now-startT)/1000, frac=Math.max(0,1-el/CONFIG.totalSeconds);
    $("barFill").style.transform=`scaleX(${frac})`;
    $("sTime").textContent=el.toFixed(2);
    if (frac<=0) end(false, CONFIG.failTimeout);
  }
  // putaran halus menuju posisi spoke berikutnya
  rings.forEach(r => { r.vis += (r.pos*STEP - r.vis)*Math.min(1, dt*20); });
  draw(now);
  requestAnimationFrame(loop);
}

(function init(){
  rings = CONFIG.dotsPerRing.map((_,k) => buildRing(k));
  $("overlay").className="overlay show";
  $("oTitle").textContent="";
  $("oBody").innerHTML="<p>Ready?</p>";
  $("oBtn").textContent=CONFIG.startButton;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
